<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Quiz Challenge</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f4f7f5;
      color: #17251d;
      padding: 20px;
    }
    .app { max-width: 1050px; margin: auto; }
    .card {
      background: #fff;
      border: 1px solid #d8e2dc;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 8px 28px rgba(18, 56, 29, 0.06);
      margin: 14px 0;
    }
    .brand { font-weight: 900; color: #12633a; }
    .muted { color: #69766f; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px,1fr)); gap: 15px; }
    input, select, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd7d0;
      border-radius: 11px;
      margin: 6px 0 13px;
      background: #fff;
    }
    textarea { min-height: 100px; resize: vertical; }
    .btn {
      border: 0;
      border-radius: 11px;
      padding: 12px 17px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-primary { background: #12633a; color: #fff; }
    .btn-primary:hover { background: #0e4d2d; }
    .btn-secondary { background: #e9f3ed; color: #17251d; }
    .btn-secondary:hover { background: #d4e2db; }
    .btn-danger { background: #fee4e2; color: #9c2118; }
    .center { text-align: center; }
    .hidden { display: none !important; }
    .msg {
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
      background: #fff4e5;
      color: #8a4b00;
    }
    .success { background: #eaf8f0; color: #12633a; }
    .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .pill {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 999px;
      background: #e9f3ed;
      font-weight: 800;
    }
    .timer { font-size: 25px; font-weight: 900; color: #b42318; }
    .qcard {
      border: 1px solid #d8e2dc;
      border-radius: 15px;
      padding: 17px;
      margin: 13px 0;
    }
    .option {
      display: block;
      padding: 12px;
      border: 1px solid #d8e2dc;
      border-radius: 10px;
      margin: 8px 0;
      cursor: pointer;
    }
    .option:hover { background: #f7faf8; }
    table { width: 100%; border-collapse: collapse; overflow: hidden; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e6ece8; }
    th { background: #f4f8f5; }
    .tabs { display: flex; gap: 7px; flex-wrap: wrap; margin: 14px 0; }
    .tabs button {
      background: #edf3ef;
      border: 0;
      padding: 9px 12px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }
    .badge { font-size: 12px; font-weight: 900; padding: 5px 8px; border-radius: 999px; }
    .flag { background: #ffe7e5; color: #a51f17; }
    .ok { background: #e9f7ef; color: #17643d; }
    .subject-box { border: 1px solid #d8e2dc; border-radius: 15px; padding: 15px; margin: 12px 0; }
    .nav-bar { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 1px solid #d8e2dc; padding-bottom: 10px; }
    .nav-bar .btn { background: transparent; color: #12633a; border: 1px solid #12633a; }
    .nav-bar .btn:hover { background: #12633a; color: white; }
    .flex { display: flex; gap: 10px; flex-wrap: wrap; }
    .text-center { text-align: center; }
    @media (max-width:600px){ .container { padding:15px; } }
  </style>
</head>

<script>

const SUPABASE_URL = 'https://ucerqmewibwkxdgtgqvc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjZXJxbWV3aWJ3a3hkZ3RncXZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MzM1NDMsImV4cCI6MjA5NzEwOTU0M30.4wB1N229r__yCZo5unB1WVsnMf_Erk_p8aT1MySTgCU';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
const localMinutes = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const sha256 = async text => {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
};
const sessionKey = 'daily_quiz_session';
let S = { user: null, quiz: null, questions: [], answers: {}, startedAt: 0, timer: null, leaveCount: 0, submitted: false };

function saveSession(x) { localStorage.setItem(sessionKey, JSON.stringify(x)); }
function loadSession() { try { return JSON.parse(localStorage.getItem(sessionKey) || 'null'); } catch { return null; } }
function clearSession() { localStorage.removeItem(sessionKey); }
function show(html) { document.getElementById('app').innerHTML = html; }

/* ============================================================
   AUTH SCREENS
   ============================================================ */
function loginScreen(message = '') {
  show(`
    <div class="app">
      <div class="card" style="max-width:560px;margin:8vh auto">
        <div class="center">
          <h1 class="brand">DAILY QUIZ CHALLENGE</h1>

        </div>

            <label>Username</label>

            <label>Password</label>

function signupScreen(message = '') {
  show(`
    <div class="app">
      <div class="card" style="max-width:600px;margin:5vh auto">
        <h2>Create account</h2>
        <p class="muted">Choose your stream carefully. It controls the final 5 questions.</p>
        <label>Username</label><input id="suUser">
        <label>Password</label><input id="suPass" type="password">
        <label>Stream</label>
        <select id="suStream">
          <option value="science">Science</option>
          <option value="commercial">Commercial</option>
          <option value="art">Art</option>

        <button class="btn btn-secondary" onclick="loginScreen()">Back to login</button>

      </div>
    </div>
  `);
}

async function signup() {
  try {
    const username = document.getElementById('suUser').value.trim();
    const password = document.getElementById('suPass').value;
    const stream = document.getElementById('suStream').value;
    const q = document.getElementById('suQuestion').value.trim();
    const a = document.getElementById('suAnswer').value.trim();
    if (!username || !password || !q || !a) throw new Error('Please complete every field.');

    const { data: existing, error: e1 } = await sb.from('dq_users').select('id').eq('username', username).maybeSingle();
    if (e1) throw e1;
    if (existing) throw new Error('That username already exists.');

    const { error } = await sb.from('dq_users').insert({
      username,
      password_hash: await sha256(password),
      stream,
      security_question: q,
      security_answer_hash: await sha256(a.toLowerCase())
    });
    if (error) throw error;
    loginScreen('Account created successfully. You can now log in.');
  } catch (e) {
    signupScreen(esc(e.message));
  }
}

async function login() {
  try {
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    // Admin hardcoded
    if (u === 'Ogonor Prince Bright' && p === '09068491316') {
      saveSession({ admin: true, username: u });
      return adminHome();
    }
    const { data: user, error } = await sb.from('dq_users').select('*').eq('username', u).maybeSingle();
    if (error) throw error;
    if (!user || user.password_hash !== await sha256(p)) throw new Error('Invalid username or password.');
    saveSession({ id: user.id, username: user.username, stream: user.stream });
    studentHome();
  } catch (e) {
    loginScreen(esc(e.message));
  }
}

async function forgotPassword() {
  const username = prompt('Enter your username:');
  if (!username) return;
  try {
    const { data: u, error } = await sb.from('dq_users').select('*').eq('username', username.trim()).maybeSingle();
    if (error) throw error;
    if (!u) throw new Error('Username not found.');
    const answer = prompt(u.security_question);
    if (answer === null) return;
    if (await sha256(answer.trim().toLowerCase()) !== u.security_answer_hash) throw new Error('Incorrect security answer.');
    const np = prompt('Enter your new password:');
    if (!np) return;
    const { error: e } = await sb.from('dq_users').update({ password_hash: await sha256(np) }).eq('id', u.id);
    if (e) throw e;
    alert('Password changed successfully.');
  } catch (e) { alert(e.message); }
}

function logout() {
  clearSession();
  clearInterval(S.timer);
  loginScreen();
}

/* ============================================================
   QUIZ STATUS
   ============================================================ */
function quizStatus() {
  const m = localMinutes();
  if (m < 720) return 'before';      // before 12:00
  if (m < 1080) return 'open';       // 12:00 – 17:59
  if (m < 1110) return 'closed';     // 18:00 – 18:29
  return 'reveal';                   // >= 18:30
}

/* ============================================================
   STUDENT HOME
   ============================================================ */
async function studentHome() {
  const ses = loadSession();
  if (!ses || ses.admin) return loginScreen();
  S.user = ses;

  const { data: quiz, error } = await sb.from('dq_quizzes').select('*').eq('quiz_date', today()).maybeSingle();
  if (error) return studentShell(`<div class="msg">${esc(error.message)}</div>`);
  S.quiz = quiz;
  if (!quiz) return studentShell('<div class="msg">No quiz has been scheduled for today.</div>');

  const { data: attempt } = await sb.from('dq_attempts').select('*').eq('user_id', ses.id).eq('quiz_id', quiz.id).maybeSingle();
  const st = quizStatus();

  if (attempt) {
    if (st === 'reveal') return leaderboardPage();
    return studentShell(`
      <div class="card">
        <div class="success">✅ You have successfully completed this quiz.<br>Check your score and leaderboard at <b>6:30 PM</b>.</div>
      </div>
    `);
  }

  if (st === 'before') return studentShell(`
    <div class="card center">
      <h2>Today’s quiz</h2>
      <p>The quiz opens at exactly <b>12:00 PM</b>.</p>
    </div>
  `);

  if (st === 'closed') return studentShell(`
    <div class="card center">
      <h2>Quiz closed</h2>
      <p>The attempt window closed at <b>6:00 PM</b>.</p>
      <p>Leaderboard will be revealed at <b>6:30 PM</b>.</p>
    </div>
  `);

  // Quiz is open – start
  startQuiz();
}

function studentShell(body) {
  show(`
    <div class="app">
      <div class="top">
        <div>
          <h2 class="brand">DAILY QUIZ CHALLENGE</h2>
          <span class="pill">${esc(S.user.username)} • ${esc(S.user.stream.toUpperCase())}</span>
        </div>
        <button class="btn btn-secondary" onclick="logout()">Logout</button>
      </div>
      <div class="nav-bar">
        <button class="btn" onclick="studentHome()">Dashboard</button>
        <button class="btn" onclick="leaderboardPage()">Leaderboard</button>
        <button class="btn" onclick="pastQuizzes()">Past Quizzes</button>
      </div>
      ${body}
    </div>
  `);
}

/* ============================================================
   START QUIZ
   ============================================================ */
async function startQuiz() {
  const common = await sb.from('dq_questions').select('*').eq('quiz_id', S.quiz.id).in('subject', ['maths','english','general_knowledge']);
  const special = await sb.from('dq_questions').select('*').eq('quiz_id', S.quiz.id).eq('subject', S.user.stream);
  if (common.error || special.error) return studentShell('<div class="msg">Could not load today’s questions.</div>');

  S.questions = [...common.data, ...special.data].sort(() => Math.random() - 0.5);
  if (S.questions.length !== 20) {
    return studentShell(`<div class="msg">Today’s quiz is not ready. It needs exactly 20 questions for your stream; currently ${S.questions.length} are available.</div>`);
  }

  S.answers = {};
  S.leaveCount = 0;
  S.submitted = false;
  S.startedAt = Date.now();
  renderQuiz();
  startTimer();
  installAntiCheat();
}

function renderQuiz() {
  let h = `
    <div class="card">
      <div class="top">
        <span class="pill">20 Questions • 100 Marks</span>
        <span id="timer" class="timer">10:00</span>
      </div>
      <div id="cheatWarn"></div>
    </div>
  `;
  S.questions.forEach((x, i) => {
    h += `
      <div class="qcard">
        <div><b>Q${i+1}.</b> ${esc(x.question)}</div>
        <small class="muted">${esc(x.subject)} • ${x.marks} marks</small>
    `;
    (x.options || []).forEach((o, j) => {
      h += `
        <label class="option">
          <input type="radio" name="q${i}" onchange="choose(${i},${j})"> ${esc(o)}
        </label>
      `;
    });
    h += `</div>`;
  });
  h += `
    <div class="card center">
      <button class="btn btn-primary" onclick="submitQuiz(false,false)">Submit quiz</button>
    </div>
  `;
  studentShell(h);
}

function choose(i, j) { S.answers[i] = j; }

function startTimer() {
  clearInterval(S.timer);
  S.timer = setInterval(() => {
    const left = Math.max(0, 600 - Math.floor((Date.now() - S.startedAt) / 1000));
    const timerEl = document.getElementById('timer');
    if (timerEl) timerEl.textContent = Math.floor(left/60) + ':' + String(left%60).padStart(2,'0');
    if (left === 0) submitQuiz(true, false);
  }, 250);
}

function installAntiCheat() {
  document.addEventListener('visibilitychange', visibilityHandler);
  window.addEventListener('blur', blurHandler);
}
function removeAntiCheat() {
  document.removeEventListener('visibilitychange', visibilityHandler);
  window.removeEventListener('blur', blurHandler);
}
function violation() {
  if (S.submitted) return;
  S.leaveCount++;
  const warn = document.getElementById('cheatWarn');
  if (warn) warn.innerHTML = `<div class="msg">⚠️ Anti-cheat warning ${S.leaveCount}/5: you left the quiz tab. Return immediately.</div>`;
  if (S.leaveCount >= 5) submitQuiz(true, true);
}
function visibilityHandler() { if (document.hidden && S.questions.length && !S.submitted) violation(); }
function blurHandler() { if (S.questions.length && !S.submitted && document.visibilityState === 'hidden') violation(); }

async function submitQuiz(auto, flag) {
  if (S.submitted) return;
  S.submitted = true;
  clearInterval(S.timer);
  removeAntiCheat();

  let total = 0;
  const marks = { maths:0, english:0, general_knowledge:0, science:0, commercial:0, art:0 };
  S.questions.forEach((x, i) => {
    if (Number(S.answers[i]) === Number(x.correct_index)) {
      total += Number(x.marks);
      marks[x.subject] += Number(x.marks);
    }
  });
  const elapsed = Math.min(600, Math.floor((Date.now() - S.startedAt) / 1000));
  const payload = {
    user_id: S.user.id,
    quiz_id: S.quiz.id,
    score: total,
    elapsed_seconds: elapsed,
    maths_score: marks.maths,
    english_score: marks.english,
    gk_score: marks.general_knowledge,
    stream_score: marks[S.user.stream],
    flagged_cheating: !!flag,
    auto_submitted: !!auto
  };

  const { error } = await sb.from('dq_attempts').insert(payload);
  if (error) {
    S.submitted = false;
    alert(error.message);
    return;
  }
  studentShell(`
    <div class="card center">
      <h2>Quiz completed</h2>
      <div class="success">✅ You have successfully completed this quiz.</div>
      <p>Your score is hidden until <b>6:30 PM</b>.</p>
      ${flag ? '<p class="msg">⚠️ Your attempt has been flagged for leaving the quiz.</p>' : ''}
    </div>
  `);
}

/* ============================================================
   LEADERBOARD
   ============================================================ */
async function leaderboardPage() {
  const { data: rows, error } = await sb.from('dq_attempts').select('*, dq_users(username, stream)').eq('quiz_id', S.quiz.id);
  if (error) return studentShell('<div class="msg">'+esc(error.message)+'</div>');

  let body = `
    <div class="card">
      <h2>🏆 Leaderboards</h2>
      <p class="muted">${esc(S.quiz.quiz_date)} • Results revealed at 6:30 PM</p>
      <div class="tabs">
        <button onclick="renderLB('overall')">Overall</button>
        <button onclick="renderLB('science')">Science</button>
        <button onclick="renderLB('commercial')">Commercial</button>
        <button onclick="renderLB('art')">Art</button>
        <button onclick="renderLB('maths')">Mathematics</button>
        <button onclick="renderLB('english')">English</button>
        <button onclick="renderLB('gk')">General Knowledge</button>
        <button onclick="renderLB('stream')">Stream Subject</button>
      </div>
      <div id="lbArea"></div>
    </div>
  `;
  studentShell(body);
  window._lbRows = rows;
  renderLB('overall');
}

function scoreFor(r, mode) {
  if (mode === 'maths') return Number(r.maths_score);
  if (mode === 'english') return Number(r.english_score);
  if (mode === 'gk') return Number(r.gk_score);
  if (mode === 'stream') return Number(r.stream_score);
  return Number(r.score);
}

function renderLB(mode) {
  let arr = [...(window._lbRows || [])];
  if (['science','commercial','art'].includes(mode)) {
    arr = arr.filter(r => r.dq_users?.stream === mode);
  }
  arr.sort((a,b) => (scoreFor(b,mode) - scoreFor(a,mode)) || (Number(a.elapsed_seconds) - Number(b.elapsed_seconds)));
  const max = (mode === 'overall') ? 100 : 25;
  const area = document.getElementById('lbArea');
  if (!area) return;
  area.innerHTML = `
    <h3>${mode==='overall' ? 'Overall Leaderboard' :
            mode==='stream' ? 'Stream Subject Leaderboard' :
            mode[0].toUpperCase() + mode.slice(1) + ' Leaderboard'}</h3>
    <div style="overflow:auto">
      <table>
        <tr><th>Rank</th><th>Participant</th><th>Stream</th><th>Score</th><th>Time</th><th>Status</th></tr>
        ${arr.map((r,i) => `
          <tr>
            <td>${i+1}</td>
            <td>${esc(r.dq_users?.username)}</td>
            <td>${esc(r.dq_users?.stream)}</td>
            <td><b>${scoreFor(r,mode)}/${max}</b>${mode==='overall' ? ` (${scoreFor(r,mode)}%)` : ''}</td>
            <td>${Math.floor(r.elapsed_seconds/60)}:${String(r.elapsed_seconds%60).padStart(2,'0')}</td>
            <td>${r.flagged_cheating ? '<span class="badge flag">⚠️ FLAGGED</span>' : '<span class="badge ok">CLEAR</span>'}</td>
          </tr>
        `).join('')}
      </table>
    </div>
  `;
}

/* ============================================================
   PAST QUIZZES
   ============================================================ */
async function pastQuizzes() {
  const { data, error } = await sb.from('dq_quizzes').select('id, quiz_date').lt('quiz_date', today()).order('quiz_date', { ascending: false });
  if (error) return studentShell('<div class="msg">Error loading past quizzes.</div>');
  if (!data || data.length === 0) return studentShell('<div class="card"><p>No past quizzes yet.</p></div>');

  let body = `<div class="card"><h2>Past Quizzes</h2><ul>`;
  for (const q of data) {
    body += `<li><a href="#" onclick="viewPastQuiz('${q.id}')">${q.quiz_date}</a></li>`;
  }
  body += `</ul><div id="pastDetail"></div></div>`;
  studentShell(body);
}

async function viewPastQuiz(quizId) {
  const { data: quiz } = await sb.from('dq_quizzes').select('quiz_date').eq('id', quizId).single();
  const { data: attempts, error } = await sb.from('dq_attempts').select('*, dq_users(username, stream)').eq('quiz_id', quizId);
  if (error || !quiz) {
    document.getElementById('pastDetail').innerHTML = '<p>Could not load this quiz.</p>';
    return;
  }
  // Use same render function
  window._lbRows = attempts;
  const container = document.getElementById('pastDetail');
  container.innerHTML = `
    <h3>${quiz.quiz_date}</h3>
    <div class="tabs">
      <button onclick="renderLB('overall')">Overall</button>
      <button onclick="renderLB('science')">Science</button>
      <button onclick="renderLB('commercial')">Commercial</button>
      <button onclick="renderLB('art')">Art</button>
      <button onclick="renderLB('maths')">Mathematics</button>
      <button onclick="renderLB('english')">English</button>
      <button onclick="renderLB('gk')">General Knowledge</button>
      <button onclick="renderLB('stream')">Stream Subject</button>
    </div>
    <div id="lbArea"></div>
  `;
  renderLB('overall');
}

   ADMIN PANEL

    <div class="app">
      <div class="top">
        <div>
          <h2 class="brand">DAILY QUIZ ADMIN</h2>
          <span class="pill">${esc(ses.username)}</span>
        </div>
        <button class="btn btn-secondary" onclick="logout()">Logout</button>
      </div>
      <div class="card">
        <h3>Create / schedule a quiz</h3>
        <input id="quizDate" type="date" value="${today()}">
        <button class="btn btn-primary" onclick="createQuiz()">Create quiz</button>
      </div>
      <div id="adminList"></div>
      <div id="editor"></div>
    </div>
  `);

async function createQuiz() {
  const date = document.getElementById('quizDate').value;

  const { error } = await sb.from('dq_quizzes').insert({ quiz_date: date });
  if (error) return alert(error.message);
  alert('Quiz scheduled.');
  loadAdminQuizzes();
}

async function loadAdminQuizzes() {
  const { data, error } = await sb.from('dq_quizzes').select('*').order('quiz_date', { ascending: false });
  const container = document.getElementById('adminList');
  if (error) {
    container.innerHTML = `<div class="msg">${esc(error.message)}</div>`;
    return;
  }
  container.innerHTML = `
    <div class="card">
      <h3>Scheduled / past quizzes</h3>
      ${data.map(q => `<button class="btn btn-secondary" style="margin:4px" onclick="editQuiz(${q.id},'${q.quiz_date}')">${q.quiz_date}</button>`).join('')}
    </div>
  `;
}

async function editQuiz(id, date) {
  let h = `
    <div class="card">
      <h2>Question editor — ${date}</h2>
      <p class="muted">Each subject must contain exactly 5 questions and exactly 25 marks.</p>
  `;
  const subjects = ['maths', 'english', 'general_knowledge', 'science', 'commercial', 'art'];
  for (const subject of subjects) {
    h += `
      <div class="subject-box">
        <h3>${subject.replace('_', ' ').toUpperCase()}</h3>
    `;
    for (let i = 1; i <= 5; i++) {
      h += `
        <div class="qcard">
          <b>Question ${i}</b>
          <textarea id="q_${subject}_${i}" placeholder="Question text"></textarea>
          <input id="o_${subject}_${i}" placeholder="Four options separated by | e.g. Option A|Option B|Option C|Option D">
          <input id="c_${subject}_${i}" type="number" min="0" max="3" placeholder="Correct option: 0,1,2 or 3">
          <input id="m_${subject}_${i}" type="number" min="1" max="25" placeholder="Marks">
        </div>
      `;
    }
    h += `<button class="btn btn-primary" onclick="saveSubject(${id},'${subject}')">Save ${subject.replace('_',' ')}</button></div>`;
  }
  h += '</div>';
  document.getElementById('editor').innerHTML = h;
}

async function saveSubject(quizId, subject) {
  let items = [];
  let total = 0;
  for (let i = 1; i <= 5; i++) {
    const question = document.getElementById(`q_${subject}_${i}`).value.trim();
    const options = document.getElementById(`o_${subject}_${i}`).value.split('|').map(x => x.trim());
    const correct = Number(document.getElementById(`c_${subject}_${i}`).value);
    const marks = Number(document.getElementById(`m_${subject}_${i}`).value);
    if (!question || options.length !== 4 || options.some(x => !x) || !Number.isInteger(correct) || correct < 0 || correct > 3 || !marks) {
      throw new Error('Complete all 5 questions correctly.');
    }
    total += marks;
    items.push({ quiz_id: quizId, subject, question, options, correct_index: correct, marks });
  }
  if (total !== 25) return alert(`${subject} must total exactly 25 marks. Current total: ${total}.`);

  const { error: delError } = await sb.from('dq_questions').delete().eq('quiz_id', quizId).eq('subject', subject);
  if (delError) return alert(delError.message);
  const { error } = await sb.from('dq_questions').insert(items);
  if (error) return alert(error.message);
  alert(`${subject.replace('_',' ')} saved successfully: 25/25 marks.`);
}
