                <div class="top" style="margin-top:4px">
                  <span class="muted" id="total_${subject}"></span>
                  <button class="btn btn-primary" id="savebtn_${subject}" onclick="saveSubject(${id},'${subject}')">💾 Save ${subjectLabel(subject)}</button>
                </div>
                <div id="msg_${subject}"></div>
              </div>`;
            }
            $('editor').innerHTML = h;
            subjects.forEach(updateTotal);
        }

        function updateTotal(subject) {
            let total = 0;
            for (let i = 1; i <= 5; i++) {
                total += Number($(`m_${subject}_${i}`)?.value || 0);
            }
            const el = $(`total_${subject}`);
            const btn = $(`savebtn_${subject}`);
            if (el) {
                if (total > 25) {
                    el.innerHTML = `Running total: <b class="bad">${total}/25 — exceeds by ${total - 25}</b>`;
                } else if (total === 25) {
                    el.innerHTML = `Running total: <b class="good">${total}/25 — ready</b>`;
                } else {
                    el.innerHTML = `Running total: <b class="bad">${total}/25 — ${25 - total} mark(s) remaining</b>`;
                }
            }
            if (btn) btn.disabled = total > 25;
        }

        async function saveSubject(quizId, subject) {
            const msgEl = $(`msg_${subject}`);
            try {
                let items = [];
                let total = 0;
                for (let i = 1; i <= 5; i++) {
                    const question = $(`q_${subject}_${i}`).value.trim();
                    const options = [
                        $(`oa_${subject}_${i}`).value.trim(),
                        $(`ob_${subject}_${i}`).value.trim(),
                        $(`oc_${subject}_${i}`).value.trim(),
                        $(`od_${subject}_${i}`).value.trim()
                    ];
                    const correctRaw = $(`c_${subject}_${i}`).value;
                    const correct = Number(correctRaw);
                    const marks = Number($(`m_${subject}_${i}`).value);
                    if (!question) throw new Error(`Question ${i} needs question text.`);
                    if (options.some(x => !x)) throw new Error(`Question ${i} needs all four options filled in.`);
                    if (correctRaw === '' || !Number.isInteger(correct) || correct < 0 || correct > 3) throw new Error(
                        `Question ${i} needs a correct answer selected.`);
                    if (!marks || marks <= 0) throw new Error(`Question ${i} needs marks greater than 0.`);
                    total += marks;
                    items.push({ quiz_id: quizId, subject, question, options, correct_index: correct, marks });
                }
                if (total > 25) throw new Error(`${subjectLabel(subject)} exceeds the 25-mark limit — currently ${total}.`);
                if (total !== 25) throw new Error(`${subjectLabel(subject)} must total exactly 25 marks — currently ${total}.`);

                const { error: delError } = await sb.from('dq_questions').delete().eq('quiz_id', quizId).eq('subject',
                    subject);
                if (delError) throw delError;
                const { error } = await sb.from('dq_questions').insert(items);
                if (error) throw error;

                msgEl.innerHTML = `<div class="banner success">✅ Saved — 25/25 marks.</div>`;
                const box = $(`box_${subject}`);
                const badge = box.querySelector('.badge');
                badge.textContent = '✅ Complete · 25/25';
                badge.className = 'badge ok';
            } catch (e) {
                msgEl.innerHTML = `<div class="banner error">${esc(e.message)}</div>`;
            }
        }

        /* ============================================================
           BULK PARSER — robust parser + mobile-friendly preview
           ============================================================ */
        function normalizeBulkSubject(raw) {
            const key = String(raw || '').trim().toLowerCase()
                .replace(/&/g, 'and')
                .replace(/[\-_]+/g, ' ')
                .replace(/\s+/g, ' ');
            const mapped = {
                'math': 'maths',
                'maths': 'maths',
                'mathematics': 'maths',
                'english': 'english',
                'general': 'general_knowledge',
                'gk': 'general_knowledge',
                'general knowledge': 'general_knowledge',
                'general knowledge or current affairs': 'general_knowledge',
                'current affairs': 'general_knowledge',
                'science': 'science',
                'commercial': 'commercial',
                'commerce': 'commercial',
                'art': 'art',
                'arts': 'art'
            };
            return mapped[key] || null;
        }

        function parseBulkQuestions(text) {
            const lines = String(text || '')
                .replace(/\r/g, '')
                .split('\n')
                .map(l => l.trim())
                .filter(Boolean);

            const result = [];
            const errors = [];
            let currentSubject = null;
            let currentQuestion = null;
            let currentNumber = null;
            let currentOptions = [];
            let currentAnswer = null;
            let currentMarks = null;

            const flushQuestion = () => {
                if (currentQuestion === null) return;
                const subject = currentSubject || 'general_knowledge';
                const answerIndex = currentAnswer ? ['A','B','C','D'].indexOf(currentAnswer) : -1;
                if (currentOptions.length !== 4) {
                    errors.push(`${subjectLabel(subject)} question ${currentNumber || result.length + 1}: needs exactly 4 options.`);
                } else if (answerIndex < 0) {
                    errors.push(`${subjectLabel(subject)} question ${currentNumber || result.length + 1}: answer must be A, B, C or D.`);
                }
                if (currentQuestion.trim() && currentOptions.length === 4 && answerIndex >= 0) {
                    result.push({
                        subject,
                        question: currentQuestion.trim(),
                        options: currentOptions.slice(0,4),
                        correct_index: answerIndex,
                        marks: Number.isFinite(currentMarks) && currentMarks > 0 ? currentMarks : 5,
                        number: currentNumber
                    });
                }
                currentQuestion = null;
                currentNumber = null;
                currentOptions = [];
                currentAnswer = null;
                currentMarks = null;
            };

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const subjectMatch = line.match(/^Subject\s*[:=]\s*(.+)$/i);
                if (subjectMatch) {
                    flushQuestion();
                    const normalized = normalizeBulkSubject(subjectMatch[1]);
                    if (!normalized) {
                        currentSubject = null;
                        errors.push(`Unknown subject "${subjectMatch[1].trim()}". Use Mathematics, English, General Knowledge, Science, Commercial or Art.`);
                    } else {
                        currentSubject = normalized;
                    }
                    continue;
                }

                const qMatch = line.match(/^(?:Q(?:uestion)?\s*)?(\d+)\s*[\.\):\-]\s*(.*)$/i);
                if (qMatch) {
                    flushQuestion();
                    currentNumber = Number(qMatch[1]);
                    currentQuestion = qMatch[2].trim();
                    continue;
                }

                const optMatch = line.match(/^([A-D])\s*[\.\):\-]\s*(.+)$/i);
                if (optMatch && currentQuestion !== null) {
                    const letter = optMatch[1].toUpperCase();
                    const index = ['A','B','C','D'].indexOf(letter);
                    currentOptions[index] = optMatch[2].trim();
                    continue;
                }

                const ansMatch = line.match(/^(?:Correct\s+)?Answer\s*[:=\-]\s*([A-D])\b/i);
                if (ansMatch && currentQuestion !== null) {
                    currentAnswer = ansMatch[1].toUpperCase();
                    continue;
                }

                const marksMatch = line.match(/^Marks?\s*[:=\-]\s*(\d+(?:\.\d+)?)\s*$/i);
                if (marksMatch && currentQuestion !== null) {
                    currentMarks = Number(marksMatch[1]);
                    continue;
                }

                // Allow wrapped question text before options.
                if (currentQuestion !== null && currentOptions.length === 0 && currentAnswer === null && currentMarks === null) {
                    currentQuestion += ' ' + line;
                }
            }
            flushQuestion();

            // Add validation errors without blocking valid questions from previewing.
            const bySubject = {};
            result.forEach(q => (bySubject[q.subject] ||= []).push(q));
            Object.entries(bySubject).forEach(([subject, qs]) => {
                const total = qs.reduce((sum,q) => sum + Number(q.marks || 0), 0);
                if (qs.length !== 5) errors.push(`${subjectLabel(subject)} has ${qs.length} parsed question(s); it needs exactly 5.`);
                if (total !== 25) errors.push(`${subjectLabel(subject)} totals ${total}/25 marks; it must total exactly 25.`);
            });

            result.errors = errors;
            return result;
        }

        function previewBulk() {
            const input = $('bulkInput');
            const preview = $('bulkPreview');
            if (!input || !preview) return;

            const parsed = parseBulkQuestions(input.value);
            if (!parsed.length) {
                preview.innerHTML = `<div class="banner error">No complete questions could be parsed. Check the format below and try again.</div>`;
                return;
            }

            const bySubject = {};
            parsed.forEach(q => (bySubject[q.subject] ||= []).push(q));
            const subjectsOrder = ['english','maths','general_knowledge','science','art','commercial'];
            const ordered = Object.keys(bySubject).sort((a,b) => subjectsOrder.indexOf(a) - subjectsOrder.indexOf(b));

            let html = `<div class="divider"></div>
                <div class="top" style="margin-bottom:8px;">
                  <div><h3>📋 Question Preview</h3><p class="muted">${parsed.length} questions parsed. Correct answers are highlighted in green.</p></div>
                  <span class="badge gold">${parsed.length} QUESTIONS</span>
                </div>`;

            html += `<div class="bulk-status">`;
            ordered.forEach(s => {
                const qs = bySubject[s];
                const total = qs.reduce((sum,q) => sum + Number(q.marks || 0), 0);
                const ok = qs.length === 5 && total === 25;
                html += `<span class="pill ${ok ? 'gold' : ''}">${esc(subjectLabel(s))}: ${qs.length}/5 · ${total}/25 ${ok ? '✅' : '⚠️'}</span>`;
            });
            html += `</div>`;

            ordered.forEach(s => {
                const qs = bySubject[s];
                const total = qs.reduce((sum,q) => sum + Number(q.marks || 0), 0);
                const ok = qs.length === 5 && total === 25;
                html += `<div class="bulk-subject-preview">
                    <div class="bulk-subject-head">
                      <h4>${esc(subjectLabel(s))}</h4>
                      <span class="badge ${ok ? 'ok' : 'pending'}">${qs.length}/5 · ${total}/25 ${ok ? '✓ Ready' : '⚠️ Check'}</span>
                    </div>`;
                qs.forEach((q, idx) => {
                    html += `<div class="bulk-question">
                      <div class="bulk-q-top">
                        <div style="display:flex;gap:9px;flex:1;align-items:flex-start;">
                          <span class="bulk-q-number">${idx+1}</span>
                          <div class="bulk-q-text">${esc(q.question)}</div>
                        </div>
                        <span class="bulk-marks">${q.marks} mark${q.marks === 1 ? '' : 's'}</span>
                      </div>
                      <div class="bulk-options">`;
                    q.options.forEach((o,j) => {
                        const letter = ['A','B','C','D'][j];
                        html += `<div class="bulk-option ${j === q.correct_index ? 'correct' : ''}"><span class="letter">${letter})</span>${esc(o)}${j === q.correct_index ? ' ✓' : ''}</div>`;
                    });
                    html += `</div></div>`;
                });
                html += `</div>`;
            });

            if (parsed.errors?.length) {
                html += `<div class="bulk-errors"><strong>⚠️ Import checks</strong><ul style="margin:7px 0 0 18px;">${parsed.errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>`;
            } else {
                html += `<div class="banner success" style="margin-top:12px;">✅ All subjects have exactly 5 questions and 25 marks. Ready to import.</div>`;
            }
            preview.innerHTML = html;
        }

        async function saveBulk(quizId) {
            const input = $('bulkInput');
            const msg = $('bulkMsg');
            if (!input || !msg) return;
            const parsed = parseBulkQuestions(input.value);

            if (!parsed.length) {
                msg.innerHTML = `<div class="banner error">No complete questions to import. Please check the format.</div>`;
                return;
            }
            if (parsed.errors?.length) {
                msg.innerHTML = `<div class="banner error"><strong>Import blocked.</strong> ${esc(parsed.errors[0])} ${parsed.errors.length > 1 ? `(+${parsed.errors.length - 1} more issue${parsed.errors.length > 2 ? 's' : ''})` : ''}</div>`;
                previewBulk();
                return;
            }

            const bySubject = {};
            parsed.forEach(q => (bySubject[q.subject] ||= []).push(q));
            const subjects = Object.keys(bySubject);
            if (!subjects.length) {
                msg.innerHTML = `<div class="banner error">No supported subjects were found.</div>`;
                return;
            }

            try {
                for (const [s, qs] of Object.entries(bySubject)) {
                    const items = qs.map(q => ({
                        quiz_id: quizId,
                        subject: s,
                        question: q.question,
                        options: q.options,
                        correct_index: q.correct_index,
                        marks: q.marks
                    }));
                    const { error: delError } = await sb.from('dq_questions').delete().eq('quiz_id', quizId).eq('subject', s);
                    if (delError) throw delError;
                    const { error } = await sb.from('dq_questions').insert(items);
                    if (error) throw error;
                }
                msg.innerHTML = `<div class="banner success">✅ Successfully imported ${parsed.length} questions across ${subjects.length} subject(s).</div>`;
                editQuiz(quizId, S.quiz?.quiz_date || today());
            } catch (e) {
                msg.innerHTML = `<div class="banner error">${esc(e.message)}</div>`;
            }
        }

        /* ============================================================
           ADMIN — USERS
           ============================================================ */
        async function adminUsers() {
            appShell('<div class="card"><p class="muted">Loading users…</p></div>', 'users');
            const { data, error } = await sb.from('dq_users').select('*').order('created_at', { ascending: false });
            if (error) { appShell(`<div class="card"><div class="banner error">${esc(error.message)}</div></div>`,
                'users'); return; }

            const streamCounts = { science: 0, commercial: 0, art: 0 };
            (data || []).forEach(u => { if (streamCounts[u.stream] !== undefined) streamCounts[u.stream]++; });

            const body = `
            <div class="card">
              <div class="top">
                <h2>👥 All participants</h2>
                <span class="pill gold">${(data || []).length} total</span>
              </div>
              <p class="muted">Every registered user, new and old.</p>
              <div class="flex" style="margin-top:10px">
                <span class="pill">🔬 Science &middot; ${streamCounts.science}</span>
                <span class="pill">📊 Commercial &middot; ${streamCounts.commercial}</span>
                <span class="pill">🎨 Art &middot; ${streamCounts.art}</span>
              </div>
              <div class="card" style="margin-top:14px;padding:12px 14px;background:var(--surface-2);">
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                  <strong>Sort users:</strong>
                  <select id="userSort" onchange="sortUsers(this.value)" style="min-width:180px;">
                    <option value="newest">🆕 Newest → Oldest</option>
                    <option value="oldest">📅 Oldest → Newest</option>
                    <option value="az">🔤 Alphabetical A → Z</option>
                    <option value="za">🔤 Alphabetical Z → A</option>
                  </select>
                </div>
              </div>
              <div id="usersTableArea" style="overflow:auto;margin-top:16px;border-radius:var(--radius-sm);border:1px solid var(--border);">
                <table>
                  <thead><tr><th>#</th><th>Username</th><th>Stream</th><th>Security question</th><th>Joined</th></tr></thead>
                  <tbody>
                  ${(data || []).map((u, i) => `
                    <tr>
                      <td>${i + 1}</td>
                      <td><strong>${esc(u.username)}</strong></td>
                      <td><span class="pill" style="font-size:11px;padding:2px 10px;">${esc(subjectLabel(u.stream))}</span></td>
                      <td>${esc(u.security_question || '—')}</td>
                      <td class="muted" style="font-size:12px;">${u.created_at ? new Date(u.created_at).toLocaleDateString() : '—'}</td>
                    </tr>
                  `).join('') || `<tr><td colspan="5" class="muted">No users yet.</td></tr>`}
                  </tbody>
                </table>
              </div>
            </div>
          `;
            appShell(body, 'users');
            window._usersData = data || [];
            sortUsers('newest');
        }

        function sortUsers(mode) {
            const area = $('usersTableArea');
            if (!area) return;
            let arr = [...(window._usersData || [])];
            if (mode === 'az') arr.sort((a,b) => String(a.username || '').localeCompare(String(b.username || ''), undefined, { sensitivity: 'base' }));
            else if (mode === 'za') arr.sort((a,b) => String(b.username || '').localeCompare(String(a.username || ''), undefined, { sensitivity: 'base' }));
            else if (mode === 'oldest') arr.sort((a,b) => new Date(a.created_at || 0) - new Date(b.created_at || 0));
            else arr.sort((a,b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
            area.innerHTML = `
              <table>
                <thead><tr><th>#</th><th>Username</th><th>Stream</th><th>Security question</th><th>Joined</th></tr></thead>
                <tbody>
                ${arr.map((u,i) => `
                  <tr>
                    <td>${i+1}</td>
                    <td><strong>${esc(u.username)}</strong></td>
                    <td><span class="pill" style="font-size:11px;padding:2px 10px;">${esc(subjectLabel(u.stream))}</span></td>
                    <td>${esc(u.security_question || '—')}</td>
                    <td class="muted" style="font-size:12px;">${u.created_at ? new Date(u.created_at).toLocaleDateString() : '—'}</td>
                  </tr>
                `).join('') || `<tr><td colspan="5" class="muted">No users yet.</td></tr>`}
                </tbody>
              </table>`;
        }

        /* ============================================================
           COUNTDOWN UPDATER
           ============================================================ */
        function startCountdownUpdater() {
            // Update any countdown displays every second
            setInterval(() => {
                const displays = document.querySelectorAll('.countdown-display');
                if (displays.length === 0) return;
                const st = quizStatus();
                let sec = 0;
                let label = '';
                if (st === 'before') {
                    sec = secondsUntilNoon();
                    label = 'Time until quiz opens';
                } else if (st === 'open') {
                    sec = secondsUntilSix();
                    label = 'Time remaining to start';
                } else if (st === 'closed') {
                    const now = new Date();
                    const target = new Date(now);
                    target.setHours(18, 30, 0, 0);
                    sec = Math.floor((target - now) / 1000);
                    if (sec < 0) sec = 0;
                    label = 'Time until leaderboard reveal';
                } else {
                    return;
                }
                const formatted = formatCountdown(sec);
                displays.forEach(el => {
                    const labelSpan = el.querySelector('.label');
                    if (labelSpan) labelSpan.textContent = label;
                    // Update the text content while preserving the label
                    const existingLabel = el.querySelector('.label');
                    if (existingLabel) {
                        el.innerHTML = `<span class="label">${label}</span>${formatted}`;
                    } else {
                        el.textContent = formatted;
                    }
                });
            }, 1000);
        }

        /* ============================================================
           BOOT
           ============================================================ */
        const session = loadSession();
        if (session?.admin) adminHome();
        else if (session?.id) studentHome();
        else loginScreen();

        // Start countdown updater
        startCountdownUpdater();
    </script>
</body>
</html>
