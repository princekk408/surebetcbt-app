<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Quiz Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        /* ===== PREMIUM THEME ===== */
        :root {
            --bg: #f2eee9;
            --surface: #ffffff;
            --surface-2: #f8f5f1;
            --border: #e2dbd3;
            --ink: #1a1425;
            --muted: #7a6f7a;
            --primary: #1e1435;
            --primary-2: #2c1f4a;
            --primary-3: #3d2a5e;
            --accent: #d4a84b;
            --accent-2: #c4963a;
            --accent-light: #f0d68a;
            --accent-glow: rgba(212, 168, 75, 0.25);
            --success: #0f8a4b;
            --success-bg: #e7f6ee;
            --danger: #b13a30;
            --danger-bg: #fbeaea;
            --warn: #8a6a0c;
            --warn-bg: #fdf1de;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow-sm: 0 2px 8px rgba(30, 20, 53, 0.06);
            --shadow-md: 0 12px 40px rgba(30, 20, 53, 0.10);
            --shadow-lg: 0 20px 60px rgba(30, 20, 53, 0.14);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
        }

        h1,
        h2,
        h3 {
            letter-spacing: -0.02em;
            font-weight: 800;
        }
        h2 {
            font-size: 22px;
        }
        h3 {
            font-size: 16px;
            font-weight: 700;
        }
        p {
            line-height: 1.6;
        }
        .muted {
            color: var(--muted);
            font-size: 13.5px;
        }
        a {
            color: var(--accent-2);
            text-decoration: none;
        }

        /* ===== LAYOUT ===== */
        .content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 28px 24px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 26px;
            box-shadow: var(--shadow-sm);
            margin: 18px 0;
            transition: var(--transition);
        }
        .card:hover {
            box-shadow: var(--shadow-md);
        }
        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 14px;
        }
        .top:last-child {
            margin-bottom: 0;
        }
        .center {
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        .flex {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
        }
        .divider {
            height: 1px;
            background: var(--border);
            margin: 20px 0;
        }
        .gap-sm {
            gap: 6px;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .mb-12 {
            margin-bottom: 12px;
        }

        /* ===== FORMS ===== */
        input,
        select,
        textarea {
            width: 100%;
            font-family: inherit;
            font-size: 14px;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            margin: 6px 0 14px;
            background: var(--surface);
            color: var(--ink);
            transition: var(--transition);
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        label {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            display: block;
            margin-top: 4px;
        }

        /* ===== BUTTONS ===== */
        .btn {
            border: 0;
            border-radius: var(--radius-sm);
            padding: 12px 22px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-2);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(30, 20, 53, 0.25);
        }
        .btn-secondary {
            background: var(--surface-2);
            color: var(--ink);
            border: 1.5px solid var(--border);
        }
        .btn-secondary:hover {
            background: #ede8e2;
            border-color: var(--accent);
        }
        .btn-accent {
            background: var(--accent);
            color: var(--primary);
        }
        .btn-accent:hover {
            background: var(--accent-2);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(212, 168, 75, 0.35);
        }
        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger);
        }
        .btn-danger:hover {
            opacity: 0.85;
        }
        .btn-link {
            background: transparent;
            color: var(--accent-2);
            padding: 8px 0;
            width: 100%;
            text-align: center;
        }
        .btn-link:hover {
            text-decoration: underline;
        }
        .btn-ghost {
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            color: #fff;
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.10);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: var(--primary);
            font-weight: 800;
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(212, 168, 75, 0.40);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== BANNERS ===== */
        .banner {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-top: 10px;
            font-size: 13.5px;
            font-weight: 600;
        }
        .banner.warn {
            background: var(--warn-bg);
            color: var(--warn);
        }
        .banner.error {
            background: var(--danger-bg);
            color: var(--danger);
        }
        .banner.success {
            background: var(--success-bg);
            color: var(--success);
        }
        .banner.info {
            background: #e8edf5;
            color: #2a3f6a;
        }

        /* ===== PILLS & BADGES ===== */
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            font-weight: 600;
            font-size: 12.5px;
            color: var(--ink);
        }
        .pill.gold {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--primary);
        }
        .badge {
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .badge.flag {
            background: var(--danger-bg);
            color: var(--danger);
        }
        .badge.ok {
            background: var(--success-bg);
            color: var(--success);
        }
        .badge.pending {
            background: var(--warn-bg);
            color: var(--warn);
        }
        .badge.gold {
            background: var(--accent-light);
            color: var(--primary);
        }

        /* ===== TABLES ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th,
        td {
            text-align: left;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: var(--surface-2);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            font-weight: 700;
        }
        tbody tr:hover {
            background: var(--surface-2);
        }

        /* ===== RANK ===== */
        .rank {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #fff;
            font-size: 13px;
            flex-shrink: 0;
        }
        .rank-1 {
            background: linear-gradient(135deg, #f5d76e, #d4a84b);
            box-shadow: 0 2px 12px rgba(212, 168, 75, 0.4);
        }
        .rank-2 {
            background: linear-gradient(135deg, #c8d0d9, #9aa5b4);
            box-shadow: 0 2px 12px rgba(154, 165, 180, 0.3);
        }
        .rank-3 {
            background: linear-gradient(135deg, #e8c4a0, #bf8f6b);
            box-shadow: 0 2px 12px rgba(191, 143, 107, 0.3);
        }
        .rank-plain {
            background: var(--surface-2);
            color: var(--muted);
            font-weight: 700;
        }
        .rank-medal {
            font-size: 20px;
            line-height: 1;
        }

        /* ===== TOP BAR ===== */
        .topbar {
            background: var(--primary);
            color: #fff;
            padding: 16px 24px;
            border-bottom: 3px solid var(--accent);
        }
        .topbar-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-mark {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 15px;
            color: var(--primary);
            letter-spacing: 0.02em;
        }
        .brand-text .name {
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 0.01em;
        }
        .brand-text .who {
            font-size: 12px;
            color: #b8afc8;
        }
        .topbar .pill {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        /* ===== SUBNAV ===== */
        .subnav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .subnav-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            gap: 2px;
            padding: 0 24px;
            flex-wrap: wrap;
        }
        .subnav button {
            background: transparent;
            border: 0;
            padding: 14px 18px;
            font-weight: 600;
            font-size: 13.5px;
            color: var(--muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            font-family: inherit;
            transition: var(--transition);
        }
        .subnav button:hover {
            color: var(--ink);
        }
        .subnav button.active {
            color: var(--accent-2);
            border-bottom-color: var(--accent);
        }
        .subnav button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== AUTH ===== */
        .auth-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(145deg, var(--bg), #e8e0d8);
        }
        .auth-card {
            width: 100%;
            max-width: 880px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
        }
        .auth-card.single {
            grid-template-columns: 1fr;
            max-width: 440px;
        }
        .auth-side {
            background: var(--primary);
            color: #fff;
            padding: 40px 36px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        .auth-side::after {
            content: '';
            position: absolute;
            top: -40%;
            right: -30%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse, rgba(212, 168, 75, 0.12), transparent 70%);
            pointer-events: none;
        }
        .auth-side-top {
            position: relative;
            z-index: 1;
        }
        .auth-side-top .logo-mark {
            margin-bottom: 20px;
        }
        .auth-side h1 {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 10px;
        }
        .auth-side p {
            color: #c8bed8;
            font-size: 14px;
        }
        .auth-points {
            margin-top: 28px;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            z-index: 1;
        }
        .auth-points li {
            font-size: 13.5px;
            color: #ddd6e8;
            padding-left: 22px;
            position: relative;
        }
        .auth-points li::before {
            content: "◆";
            position: absolute;
            left: 0;
            top: 0;
            color: var(--accent);
            font-size: 12px;
        }
        .auth-form {
            padding: 40px 36px;
        }
        .auth-form h2 {
            margin-bottom: 4px;
        }
        @media (max-width: 680px) {
            .auth-card {
                grid-template-columns: 1fr;
            }
            .auth-side {
                display: none;
            }
            .auth-form {
                padding: 28px 22px;
            }
        }

        /* ===== QUIZ ===== */
        .quiz-header {
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            box-shadow: var(--shadow-sm);
            flex-wrap: wrap;
            gap: 10px;
        }
        .timer {
            font-family: 'Space Mono', monospace;
            font-size: 26px;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: 0.02em;
        }
        .timer.danger {
            color: var(--danger);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .qcard {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px;
            margin: 14px 0;
            border-left: 4px solid var(--border);
            transition: var(--transition);
            background: var(--surface);
        }
        .qcard.answered {
            border-left-color: var(--success);
        }
        .qcard .qmeta {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }
        .qcard .qnum-label {
            font-weight: 700;
            font-size: 14px;
        }
        .qcard .tag {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
            font-weight: 700;
        }
        .qcard .qtext {
            margin: 8px 0 14px;
            font-size: 16px;
            font-weight: 500;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            margin: 8px 0;
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition);
        }
        .option:hover {
            border-color: var(--accent);
            background: var(--surface-2);
        }
        .option.selected {
            border-color: var(--accent);
            background: rgba(212, 168, 75, 0.10);
            font-weight: 600;
        }
        .option input {
            width: auto;
            margin: 0;
            accent-color: var(--accent);
        }

        .qnav-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .qchip {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
        }
        .qchip:hover {
            border-color: var(--accent);
            transform: scale(1.04);
        }
        .qchip.answered {
            background: var(--success-bg);
            border-color: var(--success);
            color: var(--success);
        }
        .qchip.current {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* ===== ADMIN ===== */
        .subject-box .top {
            margin-bottom: 10px;
        }
        .qedit {
            display: flex;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px dashed var(--border);
        }
        .qedit:last-of-type {
            border-bottom: 0;
        }
        .qnum {
            flex: 0 0 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--muted);
            font-size: 13px;
        }
        .qfields {
            flex: 1;
            min-width: 0;
        }
        .qfields textarea {
            min-height: 56px;
        }
        .qrow {
            display: flex;
            gap: 12px;
        }
        .qrow input {
            flex: 1;
        }
        .good {
            color: var(--success);
        }
        .bad {
            color: var(--danger);
        }

        .quiz-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .quiz-chip {
            border: 1.5px solid var(--border);
            background: var(--surface);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 120px;
            font-family: inherit;
            transition: var(--transition);
        }
        .quiz-chip:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        .quiz-chip .d {
            font-weight: 700;
            font-size: 14px;
        }
        .quiz-chip small {
            color: var(--muted);
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .quiz-chip.is-today {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }
        .quiz-chip.is-past {
            opacity: 0.6;
        }

        /* ===== BULK PARSER PREVIEW ===== */
        .bulk-help {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:10px;
            margin:12px 0 14px;
        }
        .bulk-help-item {
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:12px;
            padding:12px 14px;
            font-size:12px;
            color:var(--muted);
        }
        .bulk-help-item strong { color:var(--ink); display:block; margin-bottom:3px; }
        .bulk-status {
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            margin:14px 0 4px;
        }
        .bulk-subject-preview {
            border:1px solid var(--border);
            border-radius:14px;
            overflow:hidden;
            background:var(--surface);
            margin-top:12px;
        }
        .bulk-subject-head {
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
            padding:13px 15px;
            background:var(--surface-2);
            border-bottom:1px solid var(--border);
        }
        .bulk-subject-head h4 { margin:0; font-size:14px; }
        .bulk-question {
            padding:14px 15px;
            border-bottom:1px solid var(--border);
        }
        .bulk-question:last-child { border-bottom:0; }
        .bulk-q-top {
            display:flex;
            justify-content:space-between;
            align-items:flex-start;
            gap:10px;
            margin-bottom:9px;
        }
        .bulk-q-number {
            min-width:28px; height:28px; border-radius:50%;
            display:inline-flex; align-items:center; justify-content:center;
            background:var(--primary); color:#fff; font-weight:800; font-size:12px;
        }
        .bulk-q-text { flex:1; font-weight:700; font-size:13px; line-height:1.55; }
        .bulk-marks {
            white-space:nowrap; border-radius:999px; padding:5px 9px;
            background:var(--accent-light); color:var(--primary); font-size:11px; font-weight:800;
        }
        .bulk-options { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:8px; }
        .bulk-option {
            border:1px solid var(--border); border-radius:9px; padding:8px 10px;
            font-size:12px; line-height:1.4; background:var(--surface-2);
        }
        .bulk-option.correct { border-color:var(--success); background:var(--success-bg); font-weight:700; }
        .bulk-option .letter { font-weight:900; margin-right:5px; }
        .bulk-errors {
            margin-top:12px; padding:12px 14px; border-radius:12px;

    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        'use strict';

        /* ============================================================
           SUPABASE
           ============================================================ */
        const SUPABASE_URL = 'https://ucerqmewibwkxdgtgqvc.supabase.co';
        const SUPABASE_ANON_KEY =
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjZXJxbWV3aWJ3a3hkZ3RncXZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MzM1NDMsImV4cCI6MjA5NzEwOTU0M30.4wB1N229r__yCZo5unB1WVsnMf_Erk_p8aT1MySTgCU';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        /* ============================================================
           HELPERS
           ============================================================ */
        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;',
            "'": '&#39;' }[c]));
        const today = () => new Date().toISOString().slice(0, 10);
        const localMinutes = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
        const localSeconds = () => { const d = new Date(); return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds(); };
        const sha256 = async text => {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        };

        function subjectLabel(s) {
            const map = {
                maths: 'Mathematics',
                english: 'English',
                general_knowledge: 'General Knowledge',
                science: 'Science',
                commercial: 'Commercial',
                art: 'Art'
            };
            return map[s] || s;
        }

        const sessionKey = 'daily_quiz_session';
        let S = { user: null, quiz: null, questions: [], answers: {}, startedAt: 0, timer: null, leaveCount: 0,
            submitted: false, currentIndex: 0, examStarted: false };
        let FP = { user: null };

        function saveSession(x) { localStorage.setItem(sessionKey, JSON.stringify(x)); }

        function loadSession() { try { return JSON.parse(localStorage.getItem(sessionKey) || 'null'); } catch { return null; } }

        function clearSession() { localStorage.removeItem(sessionKey); }

        function show(html) { document.getElementById('app').innerHTML = html; }

        /* ============================================================
           QUIZ STATUS
           ============================================================ */
        function quizStatus() {
            const m = localMinutes();
            if (m < 720) return 'before'; // before 12:00
            if (m < 1080) return 'open'; // 12:00 – 17:59
            if (m < 1110) return 'closed'; // 18:00 – 18:29
            return 'reveal'; // >= 18:30
        }

        function secondsUntilNoon() {
            const now = new Date();
            const noon = new Date(now);
            noon.setHours(12, 0, 0, 0);
            const diff = noon - now;
            return diff > 0 ? Math.floor(diff / 1000) : 0;
        }

        function secondsUntilSix() {
            const now = new Date();
            const six = new Date(now);
            six.setHours(18, 0, 0, 0);
            const diff = six - now;
            return diff > 0 ? Math.floor(diff / 1000) : 0;
        }

        function formatCountdown(sec) {
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            if (h > 0) return `${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
            return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        /* ============================================================
           AUTH
           ============================================================ */
        function loginScreen(message = '') {
            show(`
            <div class="auth-wrap">
              <div class="auth-card">
                <div class="auth-side">
                  <div class="auth-side-top">
                    <div class="logo-mark">DQ</div>
                    <h1>Daily Quiz Challenge</h1>
                    <p>A timed, competitive daily quiz for Science, Commercial and Art students.</p>
                  </div>
                  <ul class="auth-points">
                    <li>New quiz opens daily at <b>12:00&nbsp;PM</b>, closes at <b>6:00&nbsp;PM</b></li>
                    <li>20 questions &middot; 10 minutes &middot; 100 marks</li>
                    <li>Leaderboard revealed at <b>6:30&nbsp;PM</b></li>
                  </ul>
                </div>
                <div class="auth-form">
                  <h2>Sign in</h2>
                  <p class="muted">Enter your username and password to continue.</p>
                  <label>Username</label>
                  <input id="loginUser" autocomplete="username">
                  <label>Password</label>
                  <input id="loginPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
                  <button class="btn btn-primary" style="width:100%" onclick="login()">Sign in</button>
                  <button class="btn btn-link" onclick="forgotPasswordScreen()">Forgot password?</button>
                  ${message ? `<div class="banner warn">${message}</div>` : ''}
                  <div class="divider"></div>
                  <p class="muted center">New participant?</p>
                  <button class="btn btn-secondary" style="width:100%;margin-top:8px" onclick="signupScreen()">Create an account</button>
                </div>
              </div>
            </div>
          `);
        }

        function signupScreen(message = '') {
            show(`
            <div class="auth-wrap">
              <div class="auth-card single">
                <div class="auth-form">
                  <h2>Create your account</h2>
                  <p class="muted">Choose your stream carefully — it determines your final 5 questions.</p>
                  <label>Username</label><input id="suUser">
                  <label>Password</label><input id="suPass" type="password">
                  <label>Stream</label>
                  <select id="suStream">
                    <option value="science">Science</option>
                    <option value="commercial">Commercial</option>
                    <option value="art">Art</option>
                  </select>
                  <label>Security question</label><input id="suQuestion" placeholder="e.g. What is your favourite colour?">
                  <label>Security answer</label><input id="suAnswer">
                  <button class="btn btn-primary" style="width:100%" onclick="signup()">Create account</button>
                  <button class="btn btn-link" onclick="loginScreen()">Back to sign in</button>
                  ${message ? `<div class="banner ${/success/i.test(message) ? 'success' : 'warn'}">${message}</div>` : ''}
                </div>
              </div>
            </div>
          `);
        }

        async function signup() {
            try {
                const username = $('suUser').value.trim();
                const password = $('suPass').value;
                const stream = $('suStream').value;
                const q = $('suQuestion').value.trim();
                const a = $('suAnswer').value.trim();
                if (!username || !password || !q || !a) throw new Error('Please complete every field.');

                const { data: existing, error: e1 } = await sb.from('dq_users').select('id').eq('username', username)
                    .maybeSingle();
                if (e1) throw e1;
                if (existing) throw new Error('That username already exists.');

                const { error } = await sb.from('dq_users').insert({
                    username,
                    password_hash: await sha256(password),
                    stream,
                    security_question: q,
                    security_answer_hash: await sha256(a.toLowerCase())
                });
                if (error) throw error;
                loginScreen('Account created successfully. You can now sign in.');
            } catch (e) {
                signupScreen(esc(e.message));
            }
        }

        async function login() {
            try {
                const u = $('loginUser').value.trim();
                const p = $('loginPass').value;
                if (u === 'Ogonor Prince Bright' && p === '09068491316') {
                    saveSession({ admin: true, username: u });
                    return adminHome();
                }
                const { data: user, error } = await sb.from('dq_users').select('*').eq('username', u).maybeSingle();
                if (error) throw error;
                if (!user || user.password_hash !== await sha256(p)) throw new Error('Invalid username or password.');
                saveSession({ id: user.id, username: user.username, stream: user.stream });
                studentHome();
            } catch (e) {
                loginScreen(esc(e.message));
            }
        }

        function forgotPasswordScreen(message = '') {
            FP = { user: null };
            show(`
            <div class="auth-wrap">
              <div class="auth-card single">
                <div class="auth-form">
                  <h2>Reset password</h2>
                  <p class="muted">Enter your username to retrieve your security question.</p>
                  <label>Username</label>
                  <input id="fpUser" autocomplete="username">
                  <button class="btn btn-secondary" style="width:100%" onclick="fpFindUser()">Find account</button>
                  <div id="fpStep2"></div>
                  ${message ? `<div class="banner error">${message}</div>` : ''}
                  <button class="btn btn-link" onclick="loginScreen()">Back to sign in</button>
                </div>
              </div>
            </div>
          `);
        }

        async function fpFindUser() {
            const username = $('fpUser').value.trim();
            const step2 = $('fpStep2');
            if (!username) return;
            const { data: u, error } = await sb.from('dq_users').select('*').eq('username', username).maybeSingle();
            if (error || !u) { step2.innerHTML = `<div class="banner error">Username not found.</div>`; return; }
            FP.user = u;
            step2.innerHTML = `
            <div class="divider"></div>
            <label>${esc(u.security_question)}</label>
            <input id="fpAnswer" placeholder="Your answer">
            <label>New password</label>
            <input id="fpNewPass" type="password" placeholder="New password">
            <button class="btn btn-primary" style="width:100%" onclick="fpReset()">Reset password</button>
            <div id="fpMsg"></div>
          `;
        }

        async function fpReset() {
            const answer = $('fpAnswer').value.trim();
            const np = $('fpNewPass').value;
            const msgEl = $('fpMsg');
            if (!answer || !np) return;
            if (await sha256(answer.toLowerCase()) !== FP.user.security_answer_hash) {
                msgEl.innerHTML = `<div class="banner error">Incorrect answer.</div>`;
                return;
            }
            const { error } = await sb.from('dq_users').update({ password_hash: await sha256(np) }).eq('id', FP.user.id);
            if (error) { msgEl.innerHTML = `<div class="banner error">${esc(error.message)}</div>`; return; }
            loginScreen('Password updated successfully. You can sign in now.');
        }

        function logout() {
            clearSession();
            clearInterval(S.timer);
            loginScreen();
        }

        /* ============================================================
           APP SHELL
           ============================================================ */
        function appShell(body, active, extraNav = []) {
            const ses = loadSession();
            const isAdmin = !!ses?.admin;
            const brandWho = isAdmin ? 'Administrator' : `${esc(ses.username)} &middot; ${esc(subjectLabel(ses.stream))}`;
            let navItems = [];
            if (isAdmin) {
                navItems = [
                    ['dashboard', 'Manage Quizzes', 'adminHome'],
                    ['users', 'Users', 'adminUsers'],
                    ['leaderboard', 'Leaderboard', 'adminLeaderboardEntry'],
                    ['past', 'Past Quizzes', 'pastQuizzes']
                ];
            } else {
                const st = quizStatus();
                const lbDisabled = st !== 'reveal';
                navItems = [
                    ['dashboard', 'Dashboard', 'studentHome'],
                    ['leaderboard', 'Leaderboard', lbDisabled ? null : 'leaderboardPage'],
                    ['past', 'Past Quizzes', 'pastQuizzes']
                ];
            }
            // merge extra
            navItems = navItems.concat(extraNav);

            show(`
            <div class="topbar no-print">
              <div class="topbar-inner">
                <div class="brand-row">
                  <div class="logo-mark">DQ</div>
                  <div class="brand-text">
                    <div class="name">Daily Quiz Challenge${isAdmin ? ' — Admin' : ''}</div>
                    <div class="who">${brandWho}</div>
                  </div>
                </div>
                <button class="btn btn-ghost" onclick="logout()">Log out</button>
              </div>
            </div>
            <div class="subnav no-print">
              <div class="subnav-inner">
                ${navItems.map(([key,label,fn]) => {
                  const isActive = active === key;
                  const disabled = !fn;
                  return `<button class="${isActive ? 'active' : ''}" ${disabled ? 'disabled' : ''} onclick="${fn ? fn + '()' : ''}">${label}</button>`;
                }).join('')}
              </div>
            </div>
            <div class="content">${body}</div>
          `);
        }

        /* ============================================================
           STUDENT HOME — with Start Exam & Countdown
           ============================================================ */
        async function studentHome() {
            const ses = loadSession();
            if (!ses || ses.admin) return loginScreen();
            S.user = ses;

            const { data: quiz, error } = await sb.from('dq_quizzes').select('*').eq('quiz_date', today()).maybeSingle();
            if (error) return appShell(`<div class="banner error">${esc(error.message)}</div>`, 'dashboard');
            S.quiz = quiz;

            if (!quiz) {
                return appShell(`
              <div class="card center">
                <h2>No quiz today</h2>
                <p class="muted" style="margin-top:6px">Nothing has been scheduled for today yet. Check back later.</p>
              </div>
            `, 'dashboard');
            }

            const { data: attempt } = await sb.from('dq_attempts').select('*').eq('user_id', ses.id).eq('quiz_id', quiz.id)
                .maybeSingle();
            const st = quizStatus();

            // If already attempted
            if (attempt) {
                if (st === 'reveal') return leaderboardPage();
                const scorePrefKey = `dq_score_pref_${ses.id}_${quiz.id}`;
                const showScore = localStorage.getItem(scorePrefKey) === 'show';
                const maxScore = 100;
                const scorePct = Math.round((Number(attempt.score || 0) / maxScore) * 100);
                return appShell(`
              <div class="card center">
                <div class="banner success" style="display:inline-block">✅ You have successfully completed this quiz.</div>
                <p class="muted" style="margin-top:10px">The <b>leaderboard remains locked until exactly 6:30 PM</b>.</p>
                ${showScore ? `
                  <div class="card" style="margin-top:16px;background:var(--accent-light);border:1px solid var(--accent);">
                    <div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;">Your score</div>
                    <div style="font-size:42px;font-weight:900;color:var(--primary);margin:4px 0;">${scorePct}%</div>
                    <div class="muted">${Number(attempt.score || 0)} / 100 marks</div>
                    <div style="overflow:auto;margin-top:14px">
                      <table>
                        <tr><th>Subject</th><th>Marks</th></tr>
                        <tr><td style="text-align:left">Mathematics</td><td>${Number(attempt.maths_score || 0)}/25</td></tr>
                        <tr><td style="text-align:left">English</td><td>${Number(attempt.english_score || 0)}/25</td></tr>
                        <tr><td style="text-align:left">General Knowledge</td><td>${Number(attempt.gk_score || 0)}/25</td></tr>
                        <tr><td style="text-align:left">${esc(subjectLabel(ses.stream))}</td><td>${Number(attempt.stream_score || 0)}/25</td></tr>
                      </table>
                    </div>
                  </div>
                  <button class="btn btn-secondary" style="margin-top:12px" onclick="setScorePreference('hide', ${quiz.id})">🔒 Hide my score until 6:30 PM</button>
                ` : `
                  <div class="card" style="margin-top:16px;">
                    <div style="font-size:30px;margin-bottom:6px;">🔒</div>
                    <h3>Score hidden</h3>
                    <p class="muted" style="margin-top:6px">You chose to wait until 6:30 PM.</p>
                  </div>
                  <button class="btn btn-gold" style="margin-top:12px" onclick="setScorePreference('show', ${quiz.id})">👁️ Show my score now</button>
                `}
              </div>
            `, 'dashboard');
            }

            // Before 12:00 — countdown to noon
            if (st === 'before') {
                const sec = secondsUntilNoon();
                return appShell(`
              <div class="card center start-screen">
                <div class="big-icon">⏳</div>
                <h2>Quiz opens at 12:00 PM</h2>
                <p class="desc">Today's quiz will be available shortly. Get ready!</p>
                <div class="countdown-display" id="countdownDisplay">
                  <span class="label">Time until quiz opens</span>
                  ${formatCountdown(sec)}
                </div>
              </div>
            `, 'dashboard');
            }

            // Closed window (18:00 – 18:29)
            if (st === 'closed') {
                return appShell(`
              <div class="card center">
                <h2>Quiz window closed</h2>
                <p class="muted" style="margin-top:6px">The attempt window closed at <b>6:00 PM</b>.<br>The leaderboard will be revealed at <b>6:30 PM</b>.</p>
              </div>
            `, 'dashboard');
            }

            // Open — show Start Exam button with countdown to 6:00 PM
            if (st === 'open') {
                const sec = secondsUntilSix();
                return appShell(`
              <div class="card center start-screen">
                <div class="big-icon">📝</div>
                <h2>Today's quiz is ready</h2>
                <p class="desc">You have 10 minutes to answer 20 questions. Once you start, the timer begins — no pauses!</p>
                <div class="countdown-display" style="margin-bottom:20px;font-size:28px;padding:12px 24px;">
                  <span class="label">Time remaining to start</span>
                  ${formatCountdown(sec)}
                </div>
                <button class="btn btn-gold" style="font-size:18px;padding:16px 48px;" onclick="startExam()">
                  🚀 Start Exam
                </button>
                <p class="muted" style="margin-top:12px;font-size:12px;">You can only attempt this quiz once.</p>
              </div>
            `, 'dashboard');
            }

            // Reveal — leaderboard
            if (st === 'reveal') return leaderboardPage();

            return appShell(`<div class="card"><p class="muted">Something went wrong.</p></div>`, 'dashboard');
        }

        /* ============================================================
           START EXAM (called when user clicks the button)
           ============================================================ */
        async function startExam() {
            const ses = loadSession();
            if (!ses || ses.admin) return;
            S.user = ses;

            // Re-fetch quiz to be safe
            const { data: quiz, error } = await sb.from('dq_quizzes').select('*').eq('quiz_date', today()).maybeSingle();
            if (error || !quiz) return studentHome();
            S.quiz = quiz;

            // Check if already attempted
            const { data: attempt } = await sb.from('dq_attempts').select('*').eq('user_id', ses.id).eq('quiz_id', quiz.id)
                .maybeSingle();
            if (attempt) return studentHome();

            // Load questions
            const common = await sb.from('dq_questions').select('*').eq('quiz_id', S.quiz.id).in('subject', ['maths',
                'english', 'general_knowledge'
            ]);
            const special = await sb.from('dq_questions').select('*').eq('quiz_id', S.quiz.id).eq('subject', S.user.stream);
            if (common.error || special.error) return appShell('<div class="banner error">Could not load questions.</div>',
                'dashboard');

            S.questions = [...common.data, ...special.data].sort(() => Math.random() - 0.5);
            if (S.questions.length !== 20) {
                return appShell(
                    `<div class="banner warn">Today's quiz is not ready. Need 20 questions; currently ${S.questions.length}.</div>`,
                    'dashboard');
            }

            S.answers = {};
            S.leaveCount = 0;
            S.submitted = false;
            S.currentIndex = 0;
            S.startedAt = Date.now();
            S.examStarted = true;
            renderQuiz();
            startTimer();
            installAntiCheat();
        }

        /* ============================================================
           RENDER QUIZ (no marks shown)
           ============================================================ */
        function renderQuiz() {
            const h = `
            <div class="quiz-header">
              <div class="flex">
                <span class="pill gold">100 marks &middot; 20 questions</span>
                <span class="pill" id="progress">${Object.keys(S.answers).length}/${S.questions.length} answered</span>
              </div>
              <div id="timer" class="timer">10:00</div>
            </div>
            <div id="cheatWarn"></div>
            <div id="qArea"></div>
            <div class="card">
              <div class="flex" style="justify-content:space-between">
                <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">← Previous</button>
                <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Next →</button>
              </div>
            </div>
            <div class="card">
              <p class="muted" style="margin-bottom:10px">Jump to any question:</p>
              <div class="qnav-grid" id="qnavGrid"></div>
            </div>
            <div class="card center">
              <p class="muted" style="margin-bottom:12px">Review your answers before submitting — you only get one attempt per day.</p>
              <button class="btn btn-gold" onclick="submitClick()">📤 Submit quiz</button>
            </div>
          `;
            appShell(h, 'dashboard');
            renderCurrentQuestion();
            renderQuizNav();
        }

        function renderCurrentQuestion() {
            const i = S.currentIndex;
            const x = S.questions[i];
            const area = $('qArea');
            if (!area || !x) return;
            // No marks shown — removed the marks display
            let h = `
            <div class="qcard ${S.answers[i] !== undefined ? 'answered' : ''}" id="qcard${i}">
              <div class="qmeta">
                <span class="qnum-label">Question ${i+1} of ${S.questions.length}</span>
                <span class="tag">${esc(subjectLabel(x.subject))}</span>
              </div>
              <div class="qtext">${esc(x.question)}</div>
          `;
            (x.options || []).forEach((o, j) => {
                const sel = S.answers[i] === j;
                h += `
              <label class="option ${sel ? 'selected' : ''}">
                <input type="radio" name="q${i}" ${sel ? 'checked' : ''} onchange="choose(${i},${j})"> ${esc(o)}
              </label>
            `;
            });
            h += `</div>`;
            area.innerHTML = h;
            const prevBtn = $('prevBtn');
            const nextBtn = $('nextBtn');
            if (prevBtn) prevBtn.disabled = i === 0;
            if (nextBtn) nextBtn.disabled = i === S.questions.length - 1;
        }

        function renderQuizNav() {
            const grid = $('qnavGrid');
            if (!grid) return;
            grid.innerHTML = S.questions.map((x, i) => `
            <div class="qchip ${S.answers[i] !== undefined ? 'answered' : ''} ${i === S.currentIndex ? 'current' : ''}" onclick="goToQuestion(${i})">${i+1}</div>
          `).join('');
        }

        function goToQuestion(i) {
            S.currentIndex = i;
            renderCurrentQuestion();
            renderQuizNav();
        }

        function nextQuestion() {
            if (S.currentIndex < S.questions.length - 1) goToQuestion(S.currentIndex + 1);
        }

        function prevQuestion() {
            if (S.currentIndex > 0) goToQuestion(S.currentIndex - 1);
        }

        function choose(i, j) {
            S.answers[i] = j;
            updateProgress();
            renderCurrentQuestion();
            renderQuizNav();
        }

        function updateProgress() {
            const el = $('progress');
            if (el) el.textContent = `${Object.keys(S.answers).length}/${S.questions.length} answered`;
        }

        function submitClick() {
            const unanswered = 20 - Object.keys(S.answers).length;
            if (unanswered > 0 && !confirm(`You have ${unanswered} unanswered question(s). Submit anyway?`)) return;
            submitQuiz(false, false);
        }

        function startTimer() {
            clearInterval(S.timer);
            S.timer = setInterval(() => {
                const left = Math.max(0, 600 - Math.floor((Date.now() - S.startedAt) / 1000));
                const timerEl = $('timer');
                if (timerEl) {
                    timerEl.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
                    timerEl.classList.toggle('danger', left <= 60);
                }
                if (left === 0) submitQuiz(true, false);
            }, 250);
        }

        function installAntiCheat() {
            document.addEventListener('visibilitychange', visibilityHandler);
            window.addEventListener('blur', blurHandler);
        }

        function removeAntiCheat() {
            document.removeEventListener('visibilitychange', visibilityHandler);
            window.removeEventListener('blur', blurHandler);
        }

        function violation() {
            if (S.submitted) return;
            S.leaveCount++;
            const warn = $('cheatWarn');
            if (warn) warn.innerHTML =
                `<div class="banner error">⚠️ Anti-cheat warning ${S.leaveCount}/5 — you left the quiz tab. Return immediately or your quiz will be auto-submitted.</div>`;
            if (S.leaveCount >= 5) submitQuiz(true, true);
        }

        function visibilityHandler() { if (document.hidden && S.questions.length && !S.submitted) violation(); }

        function blurHandler() { if (S.questions.length && !S.submitted && document.visibilityState === 'hidden')
            violation(); }

        async function submitQuiz(auto, flag) {
            if (S.submitted) return;
            S.submitted = true;
            clearInterval(S.timer);
            removeAntiCheat();

            let total = 0;
            const marks = { maths: 0, english: 0, general_knowledge: 0, science: 0, commercial: 0, art: 0 };
            S.questions.forEach((x, i) => {
                if (Number(S.answers[i]) === Number(x.correct_index)) {
                    total += Number(x.marks);
                    marks[x.subject] += Number(x.marks);
                }
            });
            const elapsed = Math.min(600, Math.floor((Date.now() - S.startedAt) / 1000));
            const payload = {
                user_id: S.user.id,
                quiz_id: S.quiz.id,
                score: total,
                elapsed_seconds: elapsed,
                maths_score: marks.maths,
                english_score: marks.english,
                gk_score: marks.general_knowledge,
                stream_score: marks[S.user.stream],
                flagged_cheating: !!flag,
                auto_submitted: !!auto
            };

            const { error } = await sb.from('dq_attempts').insert(payload);
            if (error) {
                S.submitted = false;
                appShell(`<div class="banner error">${esc(error.message)}</div>`, 'dashboard');
                return;
            }
            const scorePrefKey = `dq_score_pref_${S.user.id}_${S.quiz.id}`;
            const scorePct = Math.round((total / 100) * 100);
            appShell(`
            <div class="card center">
              <h2>✅ Quiz completed</h2>
              <div class="banner success" style="display:inline-block;margin-top:10px">You have successfully completed this quiz.</div>
              <p class="muted" style="margin-top:10px">Your <b>score</b> can be shown now or kept hidden. The <b>leaderboard is locked until exactly 6:30 PM</b> no matter what you choose.</p>
              <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px">
                <button class="btn btn-gold" onclick="setScorePreference('show', ${S.quiz.id})">👁️ Show my score now</button>
                <button class="btn btn-secondary" onclick="setScorePreference('hide', ${S.quiz.id})">🔒 Hide until 6:30 PM</button>
              </div>
              ${flag ? '<div class="banner error" style="margin-top:10px">⚠️ Your attempt has been flagged for leaving the quiz tab too many times.</div>' : ''}
            </div>
          `, 'dashboard');
        }

        function setScorePreference(pref, quizId) {
            const ses = loadSession();
            if (!ses || ses.admin) return;
            localStorage.setItem(`dq_score_pref_${ses.id}_${quizId}`, pref);
            studentHome();
        }

                return appShell(`

        function scoreFor(r, mode) {
            if (mode === 'maths') return Number(r.maths_score);
            if (mode === 'english') return Number(r.english_score);
            if (mode === 'gk') return Number(r.gk_score);
            if (mode === 'stream') return Number(r.stream_score);
            return Number(r.score);
        }

        function renderLB(mode) {
            let arr = [...(window._lbRows || [])];
            if (['science', 'commercial', 'art'].includes(mode)) {
                arr = arr.filter(r => r.dq_users?.stream === mode);
            }
            arr.sort((a, b) => (scoreFor(b, mode) - scoreFor(a, mode)) || (Number(a.elapsed_seconds) - Number(b
            .elapsed_seconds)));

            const max = (mode === 'overall') ? 100 : 25;
            const area = $('lbArea');
            if (!area) return;

            const title = mode === 'overall' ? 'Overall Leaderboard' :
                mode === 'stream' ? 'Stream Subject Leaderboard' :
                subjectLabel(mode) + ' Leaderboard';
            const icon = mode === 'overall' ? '🏆' :
                mode === 'stream' ? '🎯' :
                ['science', 'commercial', 'art', 'maths', 'english', 'gk'][['science', 'commercial', 'art', 'maths',
                    'english', 'gk'
                ].indexOf(mode)] || '📊';

            if (!arr.length) {
                area.innerHTML = `
              <div class="center" style="padding:30px 0;">
                <p class="muted">No attempts to show for this category yet.</p>
              </div>
            `;
                return;
            }

            let rowsHtml = '';
            arr.forEach((r, i) => {
                const pct = Math.round((scoreFor(r, mode) / max) * 100);
                let rankHtml;
                if (i === 0) rankHtml = `<span class="rank rank-1">🥇</span>`;
                else if (i === 1) rankHtml = `<span class="rank rank-2">🥈</span>`;
                else if (i === 2) rankHtml = `<span class="rank rank-3">🥉</span>`;
                else rankHtml = `<span class="rank rank-plain">${i+1}</span>`;

                const rowClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
                rowsHtml += `
              <tr class="leaderboard-row ${rowClass}">
                <td style="width:50px;">${rankHtml}</td>
                <td><strong>${esc(r.dq_users?.username)}</strong></td>
                <td><span class="pill" style="font-size:11px;padding:2px 10px;">${esc(subjectLabel(r.dq_users?.stream))}</span></td>
                <td><strong style="font-size:18px;color:var(--primary);">${pct}%</strong></td>
                <td>${r.flagged_cheating ? '<span class="badge flag">⚠️ Flagged</span>' : '<span class="badge ok">✅ Clear</span>'}</td>
              </tr>
            `;
            });

            area.innerHTML = `
            <h3 style="margin-bottom:12px;">${icon} ${title}</h3>
            <div style="overflow:auto;border-radius:var(--radius-sm);border:1px solid var(--border);">
              <table>
                <thead>
                  <tr><th>Rank</th><th>Participant</th><th>Stream</th><th>Score</th><th>Status</th></tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
              </table>
            </div>
            <p class="muted" style="margin-top:10px;font-size:12px;text-align:center;">Showing ${arr.length} participant${arr.length > 1 ? 's' : ''}</p>
          `;
        }
